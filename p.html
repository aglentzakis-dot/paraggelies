<style>
:root{--c1:#17324D;--c2:#F2B632;--on1:#fff;--on2:#17324D;--paper:#F3F4F1;--card:#fff;--ink:#1b2733;--mute:#5d6873;--line:#dfe3e6}
*{box-sizing:border-box}
.optsh .og{margin:10px 0 4px}.optsh .ogh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:700}.optsh .ogh small{font-weight:400;color:var(--mute);font-size:12.5px}
.optsh .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip.off{opacity:.45;text-decoration:line-through}
.oreq{display:inline-block;font-size:11px;font-weight:800;color:#b42318;background:#fde8e6;border-radius:999px;padding:1px 8px;vertical-align:2px;margin-left:4px}
.optsh .og{border-radius:14px;padding:4px 6px;margin-left:-6px;margin-right:-6px;transition:background .2s}.optsh .og.miss{background:#fde8e6;box-shadow:inset 0 0 0 2px #e5484d}
.tile.prod[data-pid]{cursor:pointer}
.urg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:14px;border:2px dashed #e5484d;background:#fff;color:#b42318;cursor:pointer}.urg .ue{font-size:24px}.urg .ut{flex:1;display:flex;flex-direction:column}.urg .ut small{color:#7a2a24;font-size:12.5px}.urg .uc{width:26px;height:26px;border-radius:50%;border:2px solid #e5484d;display:flex;align-items:center;justify-content:center;font-weight:900}
.urg.on{border-style:solid;background:#fde8e6}.urg.on .uc{background:#e5484d;color:#fff}
#oadd.wait{filter:saturate(.35);opacity:.8}
.lopt{display:block;font-style:normal;font-size:12.5px;color:var(--mute);margin:1px 0}
.oqty{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:110px}
button{font:inherit}
.hdr{background:var(--c1);color:var(--on1);padding:calc(14px + env(safe-area-inset-top)) 16px 18px;display:flex;gap:12px;align-items:center}
.hdr img{width:58px;height:58px;border-radius:14px;object-fit:cover;background:#fff;flex:0 0 58px}
.hdr h1{margin:0;font-size:21px;line-height:1.15}
.hdr p{margin:3px 0 0;font-size:14px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:12px 16px}
.crumb{display:flex;align-items:center;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.back{border:0;background:var(--card);border-radius:20px;padding:8px 14px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1);cursor:pointer}
.crumb .path{font-weight:800;font-size:17px}
.again{width:100%;border:2px dashed var(--c1);background:transparent;color:var(--c1);border-radius:14px;padding:12px;font-weight:800;margin:0 0 12px;cursor:pointer}
.okline{text-align:center;font-weight:800;color:#1f6b3a;background:#E3F1E8;border-radius:12px;padding:10px 12px;margin:0 0 12px}
.again b{display:block;font-size:16px}.again small{display:block;font-weight:600;font-size:13px;opacity:.8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,.12);display:flex;gap:10px;align-items:center;z-index:20}
.bar .sum{flex:1;min-width:0}
.bar .sum b{font-size:18px;display:block}
.bar .sum span{font-size:13px;color:var(--mute)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:16px;cursor:pointer;background:var(--c1);color:var(--on1)}
.btn.alt{background:var(--c2);color:var(--on2)}
.btn.ghost{background:transparent;color:var(--c1);border:2px solid var(--c1)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.sec{background:var(--card);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sec h2{margin:0 0 10px;font-size:17px}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .ln{flex:1;min-width:0}
.line .ln b{display:block}
.line .ln span{font-size:13px;color:var(--mute)}
.line .lt{font-weight:800;min-width:70px;text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--c1);background:var(--c1);color:var(--on1)}
label.f{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input.t,textarea.t{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff;color:var(--ink)}
input.t:focus,textarea.t:focus{outline:0;border-color:var(--c1)}
.ck{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px}
.ck input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--c1)}
.err{color:#b3261e;font-weight:700;font-size:14px;margin:6px 0 0}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:800;padding:10px 0 0}
.foot{max-width:640px;margin:10px auto 0;padding:14px 16px 20px;font-size:12.5px;color:var(--mute);line-height:1.5}
.foot a{color:var(--mute)}
.foot .gl{margin-top:12px;text-align:center;font-size:11.5px;opacity:.8}
.done{text-align:center;padding:24px 8px}
.done .big{font-size:56px}
.done h2{margin:6px 0}
.code{display:inline-block;font:800 22px ui-monospace,monospace;letter-spacing:2px;background:var(--card);border-radius:10px;padding:6px 14px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.modal .box{background:var(--card);border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 10px}
.bad{max-width:520px;margin:60px auto;padding:20px;text-align:center}
.how{background:var(--card);border-left:5px solid var(--c2);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14.5px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.foot details.seller summary{cursor:pointer;font-weight:700;color:var(--ink);padding:6px 0}
.foot details.seller div{margin:4px 0}
.cattl{margin:4px 2px 12px;font-size:26px;line-height:1.15;color:var(--c1);display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--c2);padding-bottom:8px}
.sect{margin:16px 2px 8px;font-size:19px;display:flex;align-items:center;gap:6px}
.sect::after{content:"";flex:1;height:2px;background:var(--c2);opacity:.6;border-radius:2px;margin-left:6px}
.sect.d2{font-size:16.5px;margin-top:12px}.sect.d3{font-size:15px;opacity:.85}
.home-add{display:block;margin:4px auto 0;border:0;background:transparent;color:var(--c1);font-weight:700;text-decoration:underline;cursor:pointer;padding:8px}
/* 1.83 · πιο ζεστή, πιο «βιτρίνα» εμφάνιση για τον πελάτη (με τα χρώματα του πωλητή) */
html{background:color-mix(in srgb,var(--c1) 6%,var(--paper))}html,body{background:color-mix(in srgb,var(--c1) 6%,var(--paper))}
.hdr{position:relative;overflow:hidden;background:linear-gradient(125deg,var(--c1),color-mix(in srgb,var(--c1) 70%,var(--c2)));border-radius:0 0 26px 26px;padding-bottom:22px;box-shadow:0 12px 28px -16px color-mix(in srgb,var(--c1) 90%,transparent)}
.hdr::before,.hdr::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hdr::before{width:230px;height:230px;right:-80px;top:-110px;background:radial-gradient(circle,color-mix(in srgb,var(--c2) 75%,transparent),transparent 70%);opacity:.75}
.hdr::after{width:140px;height:140px;left:-50px;bottom:-80px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.hdr>*{position:relative}.hdr img{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 6px 16px rgba(0,0,0,.25)}.hdr h1{font-weight:850;letter-spacing:.2px}
.back{box-shadow:0 2px 8px -2px rgba(0,0,0,.18)}
.sec{border-radius:20px;border:1px solid color-mix(in srgb,var(--c1) 9%,transparent);box-shadow:0 1px 2px rgba(16,24,40,.04),0 10px 26px -16px color-mix(in srgb,var(--c1) 50%,transparent)}
.btn{background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 84%,#fff),var(--c1));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 16px -10px color-mix(in srgb,var(--c1) 90%,transparent);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.alt{position:relative;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 75%,#fff),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 20px -10px color-mix(in srgb,var(--c2) 90%,#000)}
.btn.alt:not(:disabled)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.btn.ghost{background:transparent;box-shadow:none}
.bar{background:color-mix(in srgb,#fff 86%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-radius:22px 22px 0 0}
.bar .sum b{font-size:20px;color:var(--c1)}
.chip{border-radius:14px;transition:background .15s}.chip.on{background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 84%,#fff),var(--c1));border-color:transparent;box-shadow:0 6px 12px -8px var(--c1)}
input.t,textarea.t{transition:border-color .15s,box-shadow .15s}input.t:focus,textarea.t:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 16%,transparent)}
.again{background:color-mix(in srgb,var(--c1) 5%,#fff);border-radius:16px}
.done .big{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.btn.alt::after{display:none}.done .big{animation:none}}
</style>
</head>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
