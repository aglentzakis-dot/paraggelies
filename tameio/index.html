es”.","Για το ταχυδρομείο συμπλήρωσε μία φορά τα στοιχεία υπηρεσίας αποστολής, πιο κάτω.":"For email, fill in the sending service details once, below.","Δεν έγινε σε: {l}.":"Not done to: {l}.","Δεν έχει ανέβει ακόμα αντίγραφο στο σύννεφο.":"No backup uploaded to the cloud yet.","Δεν έχεις ανεβάσει ακόμα αντίγραφο στο σύννεφο.":"You haven't uploaded a backup to the cloud yet.","Διάλεξε έναν ή περισσότερους τρόπους. Με το κουμπί από κάτω γίνονται όλοι μαζί.":"Choose one or more ways. The button below does them all together.","Επαναφορά από το σύννεφο:":"Restore from the cloud:","Θέλεις να γίνεται εντελώς μόνο του;":"Want it fully automatic?","Κάθε αρχείο έχει την ημερομηνία στο όνομα. Στο σύννεφο μπορείς να σβήνεις τα πολύ παλιά· αρκούν τα 5 πιο πρόσφατα.":"Each file has the date in its name. In the cloud you can delete the very old ones; the 5 most recent are enough.","Κρατήθηκε αντίγραφο μέσα στην εφαρμογή. Διάλεξε και έναν τρόπο έξω από αυτήν.":"A backup was kept inside the app. Also choose a way outside of it.","Κρατιούνται τα {n} πιο πρόσφατα αντίγραφα (ένα τη μέρα) και ένα για καθέναν από τους {m} προηγούμενους μήνες· τα παλιότερα σβήνονται μόνα τους. Αρχεία που έβαλες εσύ δεν πειράζονται.":"The {n} most recent backups are kept (one per day) plus one for each of the previous {m} months; older ones are deleted automatically. Files you added yourself are not touched.","Μέσα στην εφαρμογή κρατιέται αντίγραφο πάντα, μόνο του. Ο φάκελος και το ταχυδρομείο μπορούν να γίνονται και αυτόματα· το σύννεφο θέλει ένα πάτημα από σένα (θα σου το θυμίζει μία φορά την εβδομάδα).":"A backup is always kept inside the app, automatically. The folder and email can also be automatic; the cloud needs one tap from you (you'll be reminded once a week).","Μία φορά την εβδομάδα θα σου θυμίζει να ανεβάσεις αντίγραφο στο σύννεφο.":"Once a week it will remind you to upload a backup to the cloud.","Οδηγίες βήμα βήμα":"Step-by-step instructions","Πάτα «☁️ Ανέβασμα στο σύννεφο τώρα».":"Tap “☁️ Upload to the cloud now”.","Πέρασε μία εβδομάδα από το τελευταίο αντίγραφο στο σύννεφο.":"A week has passed since the last cloud backup.","Πού να κρατάς αντίγραφα":"Where to keep backups","Πρώτη φορά (μία φορά μόνο):":"First time (only once):","Σε υπολογιστή:":"On a computer:","Σύνδεσε τον «Κοινό φάκελο στο κινητό» (πιο κάτω) και βάλε μια εφαρμογή αυτόματου συγχρονισμού φακέλου με το σύννεφο (στο Google Play ψάξε «αυτόματος συγχρονισμός Google Drive»). Ό,τι μπαίνει στον φάκελο ανεβαίνει μόνο του.":"Connect the “Shared folder on the phone” (below) and install an app that syncs a folder with your cloud automatically (in Google Play search “autosync Google Drive”). Everything that goes into the folder is uploaded by itself.","Σύνδεσε τον φάκελο πιο κάτω, στο «Κοινός φάκελος στο κινητό».":"Connect the folder below, in “Shared folder on the phone”.",Σύννεφο:"Cloud","Σύννεφο (Google Drive, OneDrive, Dropbox, iCloud)":"Cloud (Google Drive, OneDrive, Dropbox, iCloud)","Τέλος. Τις επόμενες φορές το σύννεφο θυμάται τον φάκελο· διαλέγεις μόνο «Drive» και «Αποθήκευση».":"Done. Next times the cloud remembers the folder; you just choose “Drive” and “Save”.","Τελευταίο ανέβασμα στο σύννεφο: {d}":"Last cloud upload: {d}","Το αρχείο κατέβηκε στις «Λήψεις». Ανέβασέ το στο σύννεφο σου (π.χ. drive.google.com → «Νέο» → «Μεταφόρτωση αρχείου»).":"The file was saved to “Downloads”. Upload it to your cloud (e.g. drive.google.com → “New” → “File upload”).","Φάκελος στο κινητό":"Folder on the phone","δεν υποστηρίζεται εδώ":"not supported here",σύννεφο:"cloud",ταχυδρομείο:"email","το αρχείο κατεβαίνει στις «Λήψεις». Άνοιξε drive.google.com (ή onedrive.live.com), πάτα «Νέο» → «Μεταφόρτωση αρχείου» και διάλεξέ το.":"the file goes to “Downloads”. Open drive.google.com (or onedrive.live.com), click “New” → “File upload” and choose it.",φάκελος:"folder",προαιρετικό:"optional","(όλη η περίοδος, για Excel)":"(whole period, for Excel)","Α/Α":"No.","Αγορά παγίων":"Fixed asset purchases","Αμοιβές τρίτων" ικά:"General","Ατομική επιχείρηση":"Sole proprietorship","Πίνακας χιλιοστών από PDF ή φωτογραφία":"Shares table from PDF or photo","Αναγνώριση κειμένου…":"Recognising text…","Αναγνώριση σελίδας {n} από {m}…":"Recognising page {n} of {m}…","Ανάγνωση σελίδας {n} από {m}…":"Reading page {n} of {m}…","Πίνακας χιλιοστών":"Shares table","Ανέβασε τον πίνακα χιλιοστών της πολυκατοικίας. Η εφαρμογή τον διαβάζει, ελέγχει ότι κάθε στήλη βγάζει σύνολο 1000 και σου δείχνει τι θα περαστεί πριν αποθηκευτεί. Όσα διαμερίσματα δεν υπάρχουν, προστίθενται.":"Upload the building's shares table. The app reads it, checks that every column adds up to 1000 and shows you what will be entered before saving. Apartments that don't exist yet are added.","Επικόλληση κειμένου (π.χ. από Excel)":"Paste text (e.g. from Excel)","Μία γραμμή για κάθε διαμέρισμα, π.χ.":"One line per apartment, e.g.",Ανάγνωση:"Read","Αν η θέρμανση είναι σε χωριστό πίνακα, ανέβασέ τον μετά, χωριστά: περνάει μόνο η στήλη της θέρμανσης και τα υπόλοιπα μένουν όπως είναι.":"If heating is in a separate table, upload it afterwards, on its own: only the heating column is entered and everything else stays as it is.","Το PDF διαβάζεται μέσα στο κινητό. Για φωτογραφία ή σκαναρισμένο PDF χρειάζεται σύνδεση στο διαδίκτυο την πρώτη φορά, για να κατέβει η αναγνώριση ελληνικών. Φωτογράφισε ίσια, με καλό φως, όλο τον πίνακα.":"The PDF is read on your phone. A photo or scanned PDF needs an internet connection the first time, to download Greek text recognition. Photograph the whole table straight on, in good light.","Για τη φωτογραφία χρειάζεται σύνδεση στο διαδίκτυο.":"An internet connection is needed for the photo.","Δεν βρέθηκε πίνακας με αριθμούς. Δοκίμασε πιο καθαρή φωτογραφία ή επικόλληση κειμένου.":"No table with numbers was found. Try a clearer photo or paste the text.","Άνοιγμα…":"Opening…","Έλεγχος πίνακα χιλιοστών":"Check shares table","Πέρασέ τα":"Enter them","Όλες οι στήλες βγαίνουν σωστά. Μπορείς να τα περάσεις.":"Every column τέλνονται χωριστά.":"Heating expenses (heating oil, natural gas, boiler service) are left out of the common charges. They are issued with «🔥 Issue heating», split by the heating shares, and sent separately.","Έξοδα θέρμανσης του μήνα":"Heating expenses of the month","Προκαταβολή ή έκτακτο ποσό θέρμανσης":"Heating advance or extra amount","π.χ. Προκαταβολή πετρελαίου":"e.g. Heating oil advance",ΘΕΡΜΑΝΣΗ:"HEATING","Ο πίνακας είναι σε ποσοστά (σύνολο 100). Περνάνε σε χιλιοστά: ×10 (π.χ. 3,66% → 36,6‰).":"The table is in percentages (total 100). They are entered as per mille: ×10 (e.g. 3.66% → 36.6‰).","Ο πίνακας είναι σε κλάσματα (σύνολο 1). Περνάνε σε χιλιοστά: ×1000.":"The table is in fractions (total 1). They are entered as per mille: ×1000.","Οι γραμμές μπόιλερ (ζεστό νερό) προστίθενται στο διαμέρισμά τους, π.χ. ΒΑ1 → Α1":"Boiler rows (hot water) are added to their apartment, e.g. ΒΑ1 → Α1","Ανέβασε τον πίνακα χιλιοστών της πολυκατοικίας (PDF, φωτογραφία, Excel). Η εφαρμογή τον διαβάζει, ελέγχει ότι κάθε στήλη βγάζει σύνολο 1000 και σου δείχνει τι θα περαστεί πριν αποθηκευτεί. Όσα διαμερίσματα δεν υπάρχουν, προστίθενται.":"Upload the building's shares table (PDF, photo, Excel). The app reads it, checks that every column adds up to 1000 and shows you what will be entered before saving. Apartments that don't exist yet are added.","Excel ή CSV":"Excel or CSV","Αποθήκευσέ το από το Excel ως «.xlsx» ή «.csv» και ανέβασέ το ξανά.":"Save it from Excel as «.xlsx» or «.csv» and upload it again.","Ταμείο επιχείρησης κοντά στα Ελληνικά Λογιστικά Πρότυπα: κάθε κατηγορία έχει τον κωδικό λογαριασμού που χρησιμοποιούν οι λογιστές, και κάθε κίνηση κρατά παραστατικό, πελάτη ή προμηθευτή, ΑΦΜ, ΦΠΑ και τρόπο πληρωμής. Στο τέλος του μήνα στέλνεις στον λογιστή το «📤 Αρχείο για τον λογιστή».":"Business book close to the Greek Accounting Standards: every category has the account code accountants use, and every entry keeps document, customer or supplier, tax number, VAT and payment method. At the end of the month you send the accountant the “📤 File for the accountant”.","Για διαχειριστές πολυκατοικίας: έσοδα από τα διαμερίσματα και έξοδα όπως ανελκυστήρας, καθαριότητα, απολύμανση, ρεύμα και θέρμανση. Τις κατηγορίες τις αλλάζεις όπως θέλεις από το «Κατηγορίες».":"For building administrators: income from the apartments and expenses such as elevator, cleaning, disinfection, electricity and heating. Change the categories as you like from “Categories”.","Πετρέλαιο που κάηκε ({l})":"Heating oil burned ({l})","Χρέωση θέρμανσης με ό,τι κάηκε, όχι με ό,τι αγοράστηκε":"Charge heating by what was burned, not by what was bought","Από τη δεξαμενή: κάηκαν {l} από {a} έως {b}, αξία {v}.":"From the tank: {l} burned from {a} to {b}, worth {v}.","Για χρέωση με ό,τι κάηκε, γράψε στη δεξαμενή μετρήσεις πόντων στην αρχή και στο τέλος του μήνα.":"To charge by what was burned, record tank readings in cm at the start and end of the month.",λίτρα:"litres","Δεξαμενή πετρελαίου":"Oil tank","χωρητικότητα, πόντοι, γεμίσματα":"capacity, levels, refills","Μέτρηση: {c} πόντοι":"Reading: {c} cm","Γέμισμα: {l} × {p}":"Refill: {l} × {p}","η δεξαμενή ανέβηκε όσο έπρεπε":"the tank rose as expected","η δεξαμενή δείχνει {d} από όσα χρεώθηκαν":"the tank shows {d} versus what was charged","Κάηκαν {l}":"{l} burned",πόντοι:"cm","{l} χωρίς γνωστή τιμή":"{l} without a known price","Η στάθμη ανέβηκε {l} χωρίς γέμισμα. Έλεγξε τη μέτρηση.":"The level rose by {l} without a refill. Check the reading.",αξία:"value","χωρίς γνωστή τιμή":"without a known price","Τελευταία μέτρηση: {c} πόντοι, {d}":"Last reading: {c} cm, {d}","Χωρητικότητα {l}":"Capacity {l}",διάμετρος:"diameter",ύψος:"height","Μέτρηση πόντων":"Level reading",Γέμισμα:"Refill","Έλεγχος με το ταμείο":"Check against the cash book","Πετρέλαιο που αγοράστηκε (γεμίσματα)":"Oil bought (refills)","Πετρέλαιο γραμμένο στα έξοδα του ταμείου":"Oil recorded in the cash book expenses",Διαφορά:"Difference","Κάποιο γέμισμα δεν γράφτηκε στα έξοδα, ή κάποιο έξοδο πετρελαίου δεν έχει γέμισμα εδώ.":"A refill wasn't recorded as an expense, or an oil expense has no refill here.","Κάηκε (αξία)":"Burned (value)","Μένει στη δεξαμενή (αξία)":"Left in the tank (value)","Υπόλοιπο ταμείου":"Cash book balance","Ταμείο + πετρέλαιο στη δεξαμενή":"Cash + oil in the tank",Ιστορικό:"History","Δεν υπάρχουν ακόμα μετρήσεις ή γεμίσματα.":"No readings or refills yet.","Στοιχεία δεξαμενής":"Tank details","Μέτρα τους πόντους με τον ίδιο τρόπο κάθε φορά (π.χ. με τη βέργα, στην αρχή και στο τέλος του μήνα). Η κατανάλωση βγαίνει από τη διαφορά, μαζί με όσα μπήκαν στο μεταξύ.":"Measure the level the same way every time (e.g. with the dipstick, at the start and end of the month). Consumption comes from the difference, together with what was added in between.",Σχήμα:"Shape",Ορθογώνια:"Rectangular","Κυλινδρική όρθια":"Upright cylinder","Κυλινδρική ξαπλωτή":"Horizontal cylinder","Χωρητικότητα (λίτρα)":"Capacity (litres)","γράφεται πάνω στη δεξαμενή ή στο τιμολόγιο":"written on the tank or the invoice","Δεν ξέρω τη χωρητικότητα: βγάλ' τη από τις διαστάσεις":"I don't know the capacity: work it out from the dimensions","Πλάτος (πόντοι)":"Width (cm)",Υπολογισμός:"Calculate","Αρχικό απόθεμα":"Starting stock","Πόσο πετρέλαιο είχε η δεξαμενή όταν ξεκινάς να την παρακολουθείς, και πόσο είχε κοστίσει το λίτρο.":"How much oil the tank had when you start tracking it, and what a litre had cost.",Πόντοι:"cm","Τιμή λίτρου":"Price per litre","Γράψε το ύψος ή τη διάμετρο σε πόντους.":"Enter the height or diameter in cm.","Γράψε τη χωρητικότητα σε λίτρα, ή βγάλ' τη από τις διαστάσεις.":"Enter the capacity in litres, or work it out from the dimensions.","Διάμετρος (πόντοι)":"Diameter (cm)","Ύψος (πόντοι)":"Height (cm)","Μήκος (πόντοι)":"Length (cm)","Γράψε ύψος (ή διάμετρο) και χωρητικότητα, για να φανεί πόσα λίτρα αντιστοιχούν στους πόντους.":"Enter height (or diameter) and capacity to see how many litres each level means.","Συμπλήρωσε όλες τις διαστάσεις.":"Fil : you have {h} and you're paying {n}.

ο":"Read it","Αντίγραψε το μήνυμα της τράπεζας (SMS ή ειδοποίηση) και επικόλλησέ το εδώ. Η εφαρμογή βρίσκει μόνη της το ποσό, την ημερομηνία και το κατάστημα.":"Copy the bank's message (SMS or notification) and paste it here. The app finds the amount, the date and the shop by itself.","π.χ. Αγορά με κάρτα ****1234 ποσού 23,40 EUR στο SKLAVENITIS στις 07/10.":"e.g. Card ****1234 purchase of 23.40 EUR at SKLAVENITIS on 07/10.",Επικόλληση:"Paste","Πιο γρήγορα: «Κοινοποίηση» από τα μηνύματα":'Faster: "Share" from Messages',"Στα μηνύματα του κινητού κράτα πατημένο το SMS της τράπεζας.":"In your phone's Messages, press and hold the bank's SMS.","Πάτα «Κοινοποίηση» και διάλεξε «Ταμεία».":'Tap "Share" and choose this app.',"Ανοίγει έτοιμη η κίνηση· πατάς «Καταχώρηση».":'The transaction opens ready; you tap "Record".',"Χρειάζεται η εφαρμογή να είναι εγκατεστημένη. Για ειδοποιήσεις της εφαρμογής της τράπεζας, που δεν κοινοποιούνται, άνοιξέ τες, αντίγραψε το κείμενο και επικόλλησέ το εδώ.":"The app must be installed. For notifications of the bank's app, which can't be shared, open them, copy the text and paste it here.","Επικόλλησε πρώτα το μήνυμα.":"Paste the message first.","Το πρόχειρο είναι άδειο.":"The clipboard is empty.","Κράτα πατημένο το κουτί και πάτα «Επικόλληση».":'Press and hold the box and tap "Paste".',"Κινήσεις από το αρχείο της τράπεζας":"Transactions from the bank file",Ανέβασμα:"Upload","Δοκιμή Pro: 30 μέρες με όλα τα ταμεία ανοιχτά, δωρεάν.":"Pro trial: 30 days with all books open, free.","Η δοκιμή Pro τελειώνει σε {n} μέρα.":"The Pro trial ends in {n} day.","Η δοκιμή Pro τελειώνει σε {n} μέρες.":"The Pro trial ends in {n} days.","Μετά, τα Προσωπικά μένουν δωρεάν και όλα σου τα στοιχεία μένουν.":"After that, Personal stays free and all your data stays.","Δες τι περιλαμβάνει":"See what's included",συνδέθηκε:"connected","Ανεβαίνει μόνο του μετά από κάθε αλλαγή, στον φάκελο «GlenApps › Ταμεία» του Drive σου. Εκεί μαζεύονται και οι άλλες εφαρμογές μας, η καθεμία στον δικό της φάκελο. Μένει ένα αρχείο για κάθε μέρα του τελευταίου μήνα και ένα για κάθε μήνα του τελευταίου χρόνου. Ό,τι γράψεις χωρίς διαδίκτυο ανεβαίνει μόλις βρεθεί σύνδεση.":'It uploads by itself after every change, to the "GlenApps › Ταμεία" folder of your Drive. Our other apps gather there too, each in its own folder. One file is kept for each day of the last month and one for each month of the last year. Whatever you write offline is uploaded as soon as there is a connection.',"Πληρωμές προμηθευτών, γραμμή {n}: λείπει ο προμηθευτής — δεν θα περαστεί.":"Supplier payments, row {n}: the supplier is missing — it won't be added.","Πληρωμές προμηθευτών":"Supplier payments","{s}, γραμμή {n}: λείπει ποσό — δεν θα περαστεί.":"{s}, row {n}: the amount is missing — it won't be added.","{s}, γραμμή {n}: λείπει ή δεν διαβάζεται η ημερομηνία — δεν θα περαστεί.":"{s}, row {n}: the date is missing or unreadable — it won't be added.","Απλό πρότυπο: πληρωμές σε προμηθευτές":"Simple template: supplier payments","Διάλεξε εικονίδιο":"Choose an icon","Άλλο εικονίδιο…":"Other icon…","Χωρίς εικονίδιο":"No icon","Πέρασε: {k} {a}":"Added: {k} {a}",έσοδο:"income","Δεν άκουσα ποσό. Πες π.χ. «Τηλέφωνο 35 και 26».":`I didn't hear an amount. Say e.g. "Phone 35 and 26".`,"Πες και τι είναι, π.χ. «Τηλέφωνο 35 και 26».":'Also say what it is, e.g. "Phone 35 and 26".',"Πού να μπει το «{d}»; Διάλεξε μία φορά, την επόμενη το ξέρω.":`Where should "{d}" go? Choose once; next time I'll know.`,"Πες το έσοδο":"Say the income","Πες το έξοδο":"Say the expense","Πέρασέ το":"Add it",Μίλα:"Speak","Πάτα το 🎤 του πληκτρολογίου και πες το.":"Tap the keyboard's 🎤 and say it.","Τι άκουσα (μπορείς να το διορθώσεις)":"What I heard (you can correct it)","π.χ. Τηλέφωνο 35 και 26":"e.g. Phone 35 and 26","Πες τι είναι και πόσο: «Τηλέφωνο 35 και 26», «ΔΕΗ 80 ευρώ», «Λαϊκή 12 και μισό μετρητά», «χθες καφές 3,50». Για έσοδο πες «έσοδο μισθός 1250».":'Say what it is and how much: "Phone 35 and 26", "Electricity 80 euro", "Market 12.50 cash", "yesterday coffee 3.50". For income say "income salary 1250".',"Να ανοίγει πρώτα η φόρμα (αλλιώς περνάει αμέσως, με «Αναίρεση»)":`Open the form first (otherwise it's added right away, with "Undo")`,"Η φωνή γίνεται κείμενο από την υπηρεσία φωνής του κινητού (θέλει διαδίκτυο). Τα ποσά και τα στοιχεία σου μένουν στο κινητό.":"Your voice is turned into text by the phone's speech service (needs internet). Your amounts and data stay on the phone.","Πες ή γράψε π.χ. «Τηλέφωνο 35 και 26».":'Say or type e.g. "Phone 35 and 26".',"Δεν δόθηκε άδεια για το μικρόφωνο. Πάτα το 🎤 του πληκτρολογίου και πες το.":"No microphone permission. Tap the keyboard's 🎤 and say it.","Χρειάζεται διαδίκτυο για τη φωνή. Πάτα το 🎤 του πληκτρολογίου και πες το.":"Voice needs internet. Tap the keyboard's 🎤 and say it.","Δεν άκουσα τίποτα. Πάτα το 🎤 και ξαναπές το.":"I didn't hear anything. Tap 🎤 and say it again.","Πάτα το 🎤 και ξαναπές το.":"Tap 🎤 and say it again.","Πάτα το 🎤 και πες το.":"Tap 🎤 and say it.","Πες το":"Say it","π.χ. «Μισθός 1250»":'e.g. "Salary 1250"',"π.χ. «Τηλέφωνο 35 και 26»":'e.g. "Phone 35 and 26"',"Διόρθωσε και πάτα «Πέρασέ το».":'Correct it and tap "Add it".',"Οι αλλαγές δεν αποθηκεύτηκαν στο κινητό.":"Your changes were not saved on the phone.","Γέμισε ο χώρος της εφαρμογής.":"The app's storage is full.","Η αποθήκευση του φυλλομετρητή δεν δουλεύει.":"The browser's storage isn't working.","Κατέβασε τώρα αντίγραφο για να μη χαθούν· μην κλείσεις την εφαρμογή πριν.":"Download a backup now so they're not lost; don't close the app before that.","Κατέβασε αντίγραφο":"Download backup","Αυτό το μήνυμα έχει ήδη περαστεί.":"This message has already been added.","Ανάληψη {a} → μετρητά.":"Withdrawal {a} → cash.","Εντελώς αυτόματα, από τις ειδοποιήσεις της τράπεζας":"Fully automatic, from the bank's notifications","Με μια εφαρμογή αυτοματισμού, κάθε ειδοποίηση της τράπεζας ανοίγει τα Ταμεία με το κείμενό της και η κίνηση περνάει μόνη της, με «Αναίρεση». Αν η κατηγορία δεν είναι σίγουρη, ανοίγει η φόρμα.":`With an automation app, every bank notification opens this app with its text and the transaction is added by itself, with "Undo". If the category isn't certain, the form opens.`,"δωρεάν, από το Google Play":"free, from Google Play","Νέα μακροεντολή → Έναυσμα: «Ειδοποίηση» → «Λήψη ειδοποίησης» → διάλεξε την εφαρμογή της τράπεζάς σου.":`New macro → Trigger: "Notification" → "Notification received" → choose your bank's app.`,"Ενέργεια: «Άνοιγμα ιστοσελίδας» (Open website). Στη διεύθυνση επικόλλησε αυτή εδώ κάτω και στο τέλος πρόσθεσε από το «Μαγικό κείμενο» το «Κείμενο ειδοποίησης».":'Action: "Open website". Paste the address below and at the end add "Notification text" from "Magic text".',"Αποθήκευσε. Δοκίμασε με μια μικρή αγορά με κάρτα.":"Save. Test it with a small card purchase.",Συντομεύσεις:"Shortcuts","Συντομεύσεις → Αυτοματισμός → Νέος → «Μήνυμα» → «Περιέχει»: EUR (ή €) → «Άμεση εκτέλεση».":'Shortcuts → Automation → New → "Message" → "Contains": EUR (or €) → "Run immediately".',"Ενέργεια «Άνοιγμα URL»: επικόλλησε τη διεύθυνση και στο τέλος βάλε τη μεταβλητή «Μήνυμα» (περιεχόμενο).":'Action "Open URLs": paste the address and at the end put the "Message" variable (content).',"Η εφαρμογή αυτοματισμού διαβάζει τις ειδοποιήσεις σου στο κινητό· τα Ταμεία παίρνουν μόνο το κείμενο που τους στέλνει. Τίποτα δεν φεύγει από το κινητό.":"The automation app reads your notifications on the phone; this app only gets the text it sends. Nothing leaves the phone.","Η διεύθυνση αντιγράφηκε.":"The address was copied.","Κράτα πατημένο το κουτί και αντίγραψέ το.":"Press and hold the box and copy it.","Φωτογραφία απόδειξης":"Receipt photo","Φωτογράφισε την απόδειξη ίσια, να φαίνεται ολόκληρη και καθαρά. Η εφαρμογή βρίσκει το σύνολο, την ημερομηνία, το κατάστημα και τον ΑΦΜ, και ανοίγει έτοιμη την κίνηση για έλεγχο.":"Photograph the receipt straight, whole and sharp. The app finds the total, date, shop and tax number, and opens the transaction ready for checking.",Φωτογράφισε:"Take photo","Η ανάγνωση γίνεται μέσα στο κινητό. Η φωτογραφία δεν φυλάγεται και δεν στέλνεται πουθενά. Την πρώτη φορά κατεβαίνουν τα γράμματα της ανάγνωσης (θέλει διαδίκτυο).":"Reading happens on the phone. The photo isn't kept or sent anywhere. The first time, the reading data is downloaded (needs internet).","Διαβάζω την απόδειξη…":"Reading the receipt…","Η ανάγνωση θέλει διαδίκτυο την πρώτη φορά.":"Reading needs internet the first time.","Η απόδειξη δεν διαβάστηκε. Δοκίμασε πιο καθαρή φωτογραφία.":"The receipt couldn't be read. Try a sharper photo.","Δεν βρέθηκε ποσό στην απόδειξη. Δοκίμασε πιο καθαρή φωτογραφία ή γράψε το ποσό.":"No amount found on the receipt. Try a sharper photo or type the amount.","Από την απόδειξη. Έλεγξε το ποσό και την κατηγορία και πάτα «Καταχώρηση».":'From the receipt. Check the amount and category and tap "Record".',"διαβάζει ποσό, ημερομηνία, κατάστημα, ΑΦΜ":"reads amount, date, shop, tax number","🎯 Ξεπέρασες τον μηνιαίο προϋπολογισμό: {a} από {b}.":"🎯 You've gone over the monthly budget: {a} of {b}.","🎯 Έφτασες το 80% του μηνιαίου προϋπολογισμού: {a} από {b}.":"🎯 You've reached 80% of the monthly budget: {a} of {b}.","Για τον λογιστή: {m}":"For the accountant: {m}","{n} κίνηση, έτοιμη σε PDF και Excel.":"{n} transaction, ready as PDF and Excel.","{n} κινήσεις, έτοιμες σε PDF και Excel.":"{n} transactions, ready as PDF and Excel.","Κινήσεις: {m} ({n}). Στείλε και τα δύο στον λογιστή με όποια εφαρμογή θέλεις (ταχυδρομείο, Viber, WhatsApp).":"Transactions: {m} ({n}). Send both to the accountant with any app you like (email, Viber, WhatsApp).","Αρχείο Excel για τον λογιστή":"Excel file for the accountant","Κατάσταση κινήσεων σε PDF":"Transaction statement as PDF","Τα έστειλα — να μη μου το ξαναθυμίσει γι' αυτόν τον μήνα":"I've sent them — don't remind me again for this month","Τα Ταμεία δεν άνοιξαν σωστά.":"Cash Books didn't open properly.","Τα στοιχεία σου είναι στο κινητό και δεν χάθηκαν. Κατέβασε πρώτα αντίγραφο και στείλε μου μια φωτογραφία αυτής της οθόνης.":"Your data is on the phone and has not been lost. First download a backup, then send me a screenshot of this screen.",Ξαναδοκίμασε:"Try again","Από τις επαφές μου":"From my contacts","Αποθηκεύτηκε: {n}":"Saved: {n}",Αποθηκεύτηκε:"Saved",Παραγγελίες:"Orders","Οι πληρωμές των παραγγελιών μπαίνουν εδώ μόνες τους.":"Order payments are added here automatically.","Αγορές και πρώτες ύλες":"Purchases and raw materials","Πρώτες ύλες":"Raw materials",Εμπορεύματα:"Goods for resale",Συσκευασίες:"Packaging",Ζωοτροφές:"Animal feed","Με τα ▲ ▼ αλλάζεις τη σειρά τους στη μπάρα του Ταμείου.":"Use ▲ ▼ to change their order in the bar.","{n} οφειλή":"{n} debt","{n} οφειλές":"{n} debts","Γράψε ποιος σου χρωστάει και πόσα. Δεν μετράνε στα έσοδα μέχρι να πληρωθούν· με «✓ Πληρώθηκε» γίνονται έσοδο μόνα τους.":"Write down who owes you and how much. It doesn't count as income until paid; with “✓ Paid” it becomes income automatically.","απλήρωτα κοινόχρηστα":"unpaid common charges","έδωσε ήδη {a}":"already paid {a}","Νέα οφειλή":"New debt","Πληρώθηκαν πρόσφατα":"Recently paid","Ποιος χρωστάει":"Who owes","π.χ. Γιώργος, Καφέ «Η Γωνιά»":"e.g. George, Corner Café","Για τι":"What for","π.χ. δάνειο, τιμολόγιο 125, ενοίκιο Μαΐου":"e.g. loan, invoice 125, May rent","Από πότε":"Since when","Όταν πληρωθεί, μπαίνει στα έσοδα ως":"When paid, it goes into income as","Γράψε ποιος χρωστάει.":"Write who owes.","Γράψε το ποσό.":"Enter the amount.","Να διαγραφεί η οφειλή;":"Delete this debt?","Πληρωμή από {n}":"Payment from {n}","Πέρασε την πληρωμή":"Record payment","Χρωστάει {a}. Αν έδωσε μέρος, γράψε πόσα έδωσε· τα υπόλοιπα μένουν στην οφειλή.":"Owes {a}. If they paid part, enter how much; the rest stays owed.","Πόσα έδωσε":"How much they paid","Πέρασε έσοδο: {n} {a}":"Income recorded: {n} {a}","μένουν {a}":"{a} left","πολυκατοικία, πληρωμή, χιλιοστά":"building, payment, shares","αυτόνομη σε κάθε διαμέρισμα · κρυμμένα δεξαμενή και ωρομετρητές":"separate in each flat · tank and hour meters hidden","κεντρική · πάτα αν κάθε διαμέρισμα έχει δική του":"central · tap if each flat has its own","Κρύφτηκαν η δεξαμενή, οι ωρομετρητές και η έκδοση θέρμανσης γι' αυτή την πολυκατοικία.":"The tank, hour meters and heating bill are hidden for this building.","Φαίνονται ξανά η δεξαμενή και οι ωρομετρητές.":"The tank and hour meters are shown again.","Κάθε διαμέρισμα έχει δική του θέρμανση (χωρίς κεντρική)":"Each flat has its own heating (no central heating)","Κρύβει τη δεξαμενή πετρελαίου, τους ωρομετρητές και την έκδοση θέρμανσης μόνο γι' αυτή την πολυκατοικία.":"Hides the oil tank, hour meters and heating bill for this building only.","Αντιγραφή σε προηγούμενους μήνες":"Copy to previous months","έχει ήδη":"already has one","Δεν υπάρχουν προηγούμενοι μήνες πριν από αυτή την έκδοση.":"There are no earlier months before this bill.","Για να υπάρχουν στο αρχείο και οι μήνες πριν αρχίσεις την εφαρμογή. Μπαίνει η ίδια έκδοση (ίδια ποσά ανά διαμέρισμα) σε κάθε μήνα που θα διαλέξεις.":"So the archive also has the months before you started the app. The same bill (same amount per flat) is added to each month you choose.","Ποια έκδοση να αντιγραφεί":"Which bill to copy","Σε ποιους μήνες":"Into which months",Κανένας:"None","Ήταν όλα εξοφλημένα":"All were paid","Να μπουν οι εισπράξεις και στα έσοδα του ταμείου":"Also add the payments to the book's income","Χωρίς το δεύτερο, οι παλιοί μήνες φαίνονται μόνο στις εκδόσεις και στις αποδείξεις και δεν αλλάζουν τα έσοδα και το υπόλοιπο του ταμείου.":"Without the second option, past months only show in bills and receipts and don't change the book's income and balance.","Διάλεξε τουλάχιστον έναν μήνα.":"Choose at least one month.","Αντιγράφηκε σε {n} μήνες.":"Copied into {n} months.","Μπήκαν {e} εισπράξεις στα έσοδα.":"{e} payments added to income.","Στο τελευταίο που άνοιξα":"The last one I opened",χωρίς:"without","Δεν συμμετέχει σε":"Does not share in","Π.χ. κατάστημα ισογείου που δεν πληρώνει σκάλα, ρεύμα κοινοχρήστων ή ανελκυστήρα. Τσέκαρε ό,τι ΔΕΝ πληρώνει· το ποσό μοιράζεται στα υπόλοιπα διαμερίσματα. Όλα τα άλλα (π.χ. επισκευή αποχέτευσης) τα πληρώνει κανονικά.":"E.g. a ground-floor shop that doesn't pay for the stairs, common electricity or lift. Tick what it does NOT pay; that amount is shared among the other flats. Everything else (e.g. a drain repair) it pays as usual.","Κατάστημα ισογείου: χωρίς καθαριότητα, ρεύμα και ανελκυστήρα":"Ground-floor shop: no cleaning, electricity or lift","Οι εξαιρέσεις πρέπει να προβλέπονται από τον κανονισμό ή τον πίνακα κατανομής της πολυκατοικίας. Έλεγξέ τον πριν τις βάλεις.":"Exemptions must be provided for in the building's rules or cost-sharing table. Check it before adding them.","Τσεκαρίστηκαν: καθαριότητα, ρεύμα κοινοχρήστων, ανελκυστήρας. Άλλαξέ τα αν χρειάζεται.":"Ticked: cleaning, common electricity, lift. Change them if needed.","Όταν ανοίγεις τα Ταμεία, ανοίγουν στο ταμείο που είχες ανοιχτό τελευταίο.":"When you open Cash Books, it opens on the book you had open last.","Τα Ταμεία θα ανοίγουν στο ταμείο που είχες ανοιχτό τελευταίο.":"Cash Books will open on the book you had open last.","Όλα τα εικονίδια":"All icons","Σπίτι και λογαριασμοί":"Home and bills","Φαγητό και σούπερ μάρκετ":"Food and groceries","Αυτοκίνητο και μετακινήσεις":"Car and transport","Υγεία και προσωπική φροντίδα":"Health and personal care","Οικογένεια, παιδιά, ζώα":"Family, kids, pets","Ρούχα και ψώνια":"Clothes and shopping","Δουλειά, γραφείο, επιχείρηση":"Work, office, business","Ψυχαγωγία και συνδρομές":"Leisure and subscriptions","Σύμβολα και διάφορα":"Symbols and more",Πρόσφατα:"Recent","Ψάξε, π.χ. ρεύμα, φαρμακείο, σκύλος":"Search, e.g. power, pharmacy, dog","Δεν βρέθηκε. Δοκίμασε άλλη λέξη ή «Άλλο εικονίδιο…».":"Not found. Try another word or “Other icon…”.","Πριν ανοίξουν οι επαφές":"Before your contacts open","Στην αναζήτηση γράψε <b>2–3 γράμματα</b> και πάτα την επαφή.":"In the search, type <b>2–3 letters</b> and tap the contact.","Αν δεις «Δεν βρέθηκαν επαφές», η λίστα από κάτω είναι <b>παλιά</b> και δεν πατιέται. Σβήσε ένα γράμμα μέχρι να ξαναβγεί η επαφή. (Είναι πρόβλημα της λίστας του Chrome.)":"If you see “No contacts found”, the list below is <b>old</b> and can't be tapped. Delete a letter until the contact shows again. (This is a problem in Chrome's list.)","Αλλιώς: στις Επαφές του κινητού άνοιξε την επαφή → Κοινοποίηση → ως κείμενο → Αντιγραφή, και εδώ πάτα «📋 Επικόλληση».":"Or: in your phone's Contacts open the contact → Share → as text → Copy, then tap “📋 Paste” here.","Κατάλαβα, άνοιξε τις επαφές":"Got it, open my contacts","Επικόλλησε εδώ την επαφή (κράτα πατημένο → Επικόλληση):":"Paste the contact here (press and hold → Paste):","Δεν βρήκα όνομα ή τηλέφωνο στο κείμενο.":"I couldn't find a name or phone in the text.","Έκτακτο ποσό / αποθεματικό":"Extra amount / reserve","Ποιοι πληρώνουν το έκτακτο ποσό":"Who pays the extra amount","Πάτα για να βγάλεις ή να ξαναβάλεις ένα διαμέρισμα. Το ποσό μοιράζεται μόνο σε όσα έχουν ✓. Θυμάται την επιλογή για τους επόμενους μήνες.":"Tap to remove or add back a flat. The amount is shared only among those with ✓. Your choice is remembered for the next months.","Τουλάχιστον ένα διαμέρισμα πρέπει να πληρώνει.":"At least one flat must pay.","Αν είναι έξοδο που έγινε (π.χ. επισκευή), καλύτερα να μπει στις κινήσεις: φαίνεται στη λίστα εξόδων, αλλάζει και σβήνεται από εκεί, και ισχύουν οι εξαιρέσεις των διαμερισμάτων.":"If it's an expense that happened (e.g. a repair), better add it as an entry: it shows in the expenses list, can be edited and deleted there, and the flats' exemptions apply.","Κάν' το έξοδο του μήνα":"Make it this month's expense","Γράψε πρώτα το ποσό.":"Enter the amount first.","Πέρασε στα έξοδα του μήνα: {k} {a}. Το βρίσκεις στη λίστα κινήσεων.":"Added to this month's expenses: {k} {a}. You'll find it in the entries list.","Αλλαγή της έκδοσης":"Edit this bill",έκτακτο:"extra","Καμία κίνηση σε αυτό το διάστημα.":"No entries w? (total for the whole building)","Να μοιραστούν τα {a} στα διαμερίσματα με την επόμενη «Έκδοση κοινοχρήστων»;\n\nΟΚ = ναι, με την έκδοση · Άκυρο = τα έχω ήδη, απλή καταγραφή":`Share {a} among the flats with the next “Common charges bill”?

OK = yes, with the bill · Cancel = I already have it, just record it`,"Θα μπει στην επόμενη έκδοση κοινοχρήστων ως «Αύξηση αποθεματικού».":"It will go into the next common charges bill as “Increase reserve”.","Πόσα πληρώθηκαν από το αποθεματικό;":"How much was paid from the reserve?","Για τι; (π.χ. επισκευή αποχέτευσης)":"What for? (e.g. drain repair)","Να σβηστεί αυτή η κίνηση του αποθεματικού;":"Delete this reserve entry?","Κρύφτηκε: {n}. Το ξαναβγάζεις από το «Κρυμμένα εδώ» στο κάτω μέρος.":"Hidden: {n}. Bring it back from “Hidden here” at the bottom.","🏦 Τράπεζα":"🏦 Bank","🤝 Σου χρωστάνε":"🤝 Owed to you","🥧 Πού πάνε τα χρήματα":"🥧 Where the money goes","🎯 Προϋπολογισμός":"🎯 Budget","📅 Πάγια":"📅 Recurring","📊 Αναφορές":"📊 Reports","📋 Κινήσεις":"📋 Entries","Παλιό υπόλοιπο":"Previous balance","Παλιό υπόλοιπο (πριν ξεκινήσεις)":"Previous balance (before you started)","Όσα χρωστούσε το διαμέρισμα πριν ξεκινήσεις τα κοινόχρηστα στην εφαρμογή. Μπαίνει ως «Παλιά» στο ειδοποιητήριο: π.χ. μήνας 50 € + παλιά 100 € = σύνολο 150 €. Εισπράττεται όπως κάθε οφειλή.":"What the flat owed before you started common charges in the app. It shows as “Previous” on the notice: e.g. month €50 + previous €100 = total €150. It's collected like any debt.","Έσοδα που δεν είναι διαμερίσματα":"Income names that are not apartments","π.χ. θέσεις στάθμευσης, αποθήκες":"e.g. parking spaces, storerooms","Να ξαναπροταθούν ως διαμερίσματα τα {l};":"Suggest {l} as apartments again?","κάθε μέρα":"every day","Πληρωμή στον διαχειριστή":"Payment to the administrator","Πότε δέχεσαι πληρωμές":"When you accept payments","Μέρα παρά μέρα":"Every other day","Δευτέρα – Παρασκευή":"Monday – Friday","π.χ. ή μετά από τηλεφώνημα":"e.g. or after a phone call","Γράφεται στο ειδοποιητήριο, στο μήνυμα και στην απόδειξη. Αν το αφήσεις κενό, δεν εμφανίζεται.":"Shown on the notice, the message and the receipt. Leave it empty to hide it.","Στα έσοδα υπάρχουν ονόματα που δεν είναι ακόμα διαμερίσματα: {l}.":"Your income has names that are not apartments yet: {l}.","Αν είναι θέσεις στάθμευσης ή αποθήκες με δικά τους χιλιοστά, φτιάξ' τες κι αυτές και βάλε σε καθεμία από ποια έξοδα εξαιρείται (π.χ. ρεύμα).":"If they are parking spaces or storerooms with their own shares, add them too and set which expenses each one is excluded from (e.g. electricity).","Δεν είναι διαμερίσματα":"Not apartments","Εντάξει, δεν θα προτείνονται ως διαμερίσματα. Αλλαγή από τις Ρυθμίσεις.":"OK, they will not be suggested as apartments. Change it in Settings.","Κοινόχρηστα (ίσο ποσό ανά διαμέρισμα)":"Common charges (same amount per apartment)","Αμοιβή διαχειριστή":"Administrator fee","Ίσο ποσό σε κάθε διαμέρισμα":"Same amount for each apartment","Κοινόχρηστα ανά διαμέρισμα":"Common charges per apartment","Αμοιβή διαχειριστή ανά διαμέρισμα":"Administrator fee per apartment","Το ίδιο ποσό χρεώνεται σε κάθε διαμέρισμα. Αν το αφήσεις κενό, δεν εμφανίζεται ούτε στο ειδοποιητήριο ούτε στο μήνυμα.":"The same amount is charged to every apartment. Leave it empty and it appears neither on the notice nor in the message.","Στείλε την ηλεκτρονική απόδειξη πληρωμής":"Send the electronic payment receipt","διάλεξε τρόπο":"choose how","Απόκλιση από το αποθεματικό":"Difference from the reserve fund","ταμείο + οφειλές + πετρέλαιο = {t} · αποθεματικό {r}":"cash + debts + heating oil = {t} · reserve {r}","Συμφωνία με το ταμείο":"Reconciliation with the cash book","Ταμείο σήμερα":"Cash today","Οφειλές διαμερισμάτων σήμερα":"Apartment debts today","Πετρέλαιο στη δεξαμενή":"Heating oil in the tank",Απόκλιση:"Difference","Την πρώτη φορά, πάτα το κουμπί για να γίνει το αρχικό ποσό τέτοιο ώστε όλα μαζί να κάνουν το αποθεματικό. Αργότερα, μια απόκλιση σημαίνει κάποιο έσοδο ή έξοδο που δεν γράφτηκε.":"The first time, tap the button so the starting amount makes everything add up to the reserve. Later, a difference means some income or expense was not recorded.","Το αποθεματικό να είναι {a}":"Set the reserve to {a}","Το αποθεματικό έγινε {a}.":"The reserve is now {a}.","πληρώθηκαν {a}":"{a} paid","Μπήκαν {r} αντί για {l}: λείπουν {x} (αξία {v}). Είναι έλλειμμα του προμηθευτή, όχι του διαχειριστή.":"{r} went in instead of {l}: {x} missing (worth {v}). This is the supplier's shortfall, not the administrator's.","Το ποσό που πληρώθηκε μοιράζεται στα λίτρα που μπήκαν: {p} το λίτρο.":"The amount paid is spread over the liters that went in: {p} per liter.","Ποσό που πληρώθηκε":"Amount paid","λίτρα × τιμή":"liters × price","Λίτρα που μπήκαν πραγματικά":"Liters actually delivered","όσα του τιμολογίου":"as on the invoice","Αν η μέτρηση δείξει λιγότερα λίτρα από το τιμολόγιο, γράψε εδώ όσα μπήκαν πραγματικά. Η έλλειψη γράφεται ως έλλειμμα του προμηθευτή και δεν χρεώνεται στον διαχειριστή.":"If the measurement shows fewer liters than the invoice, enter the liters actually delivered here. The shortfall is recorded as the supplier's and is not charged to the administrator.","Πληρώθηκαν {a} αντί για {b} (λίτρα × τιμή).":"{a} paid instead of {b} (liters × price).","Λείπουν {x} από το τιμολόγιο (αξία {v}): έλλειμμα του προμηθευτή.":"{x} missing from the invoice (worth {v}): supplier's shortfall.","Γράψε {r} ως λίτρα που μπήκαν πραγματικά":"Enter {r} as liters actually delivered","Από πού προκύπτουν":"Where they come from","χρέωση {a}":"charge {a}","Οι οφειλές βγαίνουν από τις εκδόσεις που στάλθηκαν (συνήθως με τα έξοδα του προηγούμενου μήνα) και τις αρχικές οφειλές, όχι από τα έξοδα του τρέχοντος μήνα.":"Debts come from the issued notices (usually with last month's expenses) and the opening debts, not from this month's expenses.","Λίτρα τιμολογίου":"Invoiced liters","Ταμείο πολυκατοικίας":"Building cash",αποθεματικό:"reserve","αυτόνομη σε κάθε διαμέρισμα":"individual in each apartment",κεντρική:"central","χωρίς δεξαμενή":"no tank","χωριστό ειδοποιητήριο":"separate notice","δεν χρειάζονται με αυτόνομη θέρμανση":"not needed with individual heating","δεν φαίνεται η δεξαμενή · άλλαξέ το στη «Θέρμανση»":"the tank is hidden · change it under “Heating”","ποια έξοδα πληρώνει ο ιδιοκτήτης και όχι ο ενοικιαστής":"which expenses the owner pays, not the tenant","Πώς θερμαίνεται η πολυκατοικία;":"How is the building heated?","Κεντρική θέρμανση":"Central heating","ένας λέβητας για όλους· τα έξοδα θέρμανσης μοιράζονται στα διαμερίσματα":"one boiler for everyone; heating costs are shared among the apartments","Αυτόνομη σε κάθε διαμέρισμα":"Individual in each apartment","κάθε διαμέρισμα πληρώνει μόνο του τη θέρμανσή του":"each apartment pays for its own heating","Με κεντρική θέρμανση":"With central heating","Έχει δεξαμενή πετρελαίου":"Has a heating oil tank","Αν η θέρμανση είναι με φυσικό αέριο, βγάλε το τικ: η δεξαμενή δεν θα φαίνεται στον πίνακα.":"If heating is by natural gas, untick it: the tank will not show on the panel.","Με αυτόνομη θέρμανση δεν χρειάζονται δεξαμενή, ωρομετρητές και έκδοση θέρμανσης, γι' αυτό δεν φαίνονται στον πίνακα. Τα στοιχεία τους δεν σβήνονται· αν το αλλάξεις ξανά, είναι όλα εκεί.":"With individual heating there is no need for the tank, hour meters or a heating notice, so they are not shown on the panel. Their data is not deleted; if you change it back, everything is still there.","Κάποια έξοδα τα πληρώνει ο ιδιοκτήτης και όχι ο ενοικιαστής (π.χ. επισκευές, αποθεματικό, μεγάλες εργασίες). Βάλε τικ σε αυτά.":"Some expenses are paid by the owner, not the tenant (e.g. repairs, reserve fund, major works). Tick them.","Τι γίνεται: στα διαμερίσματα με ενοικιαστή, αυτά δεν μπαίνουν στο ποσό του ενοικιαστή. Γράφονται από κάτω, χωριστά, ως «Ποσό που πληρώνει ο ιδιοκτήτης». Στα διαμερίσματα χωρίς ενοικιαστή δεν αλλάζει τίποτα· απλώς φαίνονται με 👤.":"What happens: in apartments with a tenant, these are not included in the tenant's amount. They are listed separately below as “Amount paid by the owner”. In apartments without a tenant nothing changes; they are just marked with 👤.","Κανένα διαμέρισμα δεν έχει ακόμα ενοικιαστή που πληρώνει τα κοινόχρηστα, άρα προς το παρόν δεν αλλάζ il","Τηλέφωνο ενοικιαστή":"Tenant's phone","Ταχυδρομείο ενοικιαστή":"Tenant's email","Μισθωτήριο από":"Lease from","Μισθωτήριο έως":"Lease until",Μίσθωμα:"Rent",Πληρώνει:"Pays","ΕΙ θέρμανσης":"Heating share","ΕΙ μπόιλερ":"Boiler share","ΕΙ θερινό μπόιλερ":"Summer boiler share","Εξαγωγή επιλεγμένων":"Export selected","Τι μπήκε στην τελευταία εισαγωγή":"What came in with the last import",Πάγιο:"Fixed item","Πληρωμή προμηθευτή · μειώνει το χρέος ({a})":"Supplier payment · reduces the debt ({a})","Αγορά από προμηθευτή":"Purchase from supplier","{n} πληρωμές προμηθευτών μείωσαν το χρέος.":"{n} supplier payments reduced the debt.","{n} πληρωμή προμηθευτή μείωσε το χρέος.":"{n} supplier payment reduced the debt.","κάθε {d}":"every {d}","κάθε 2 εβδομάδες, {d}":"every 2 weeks, {d}","Μέρα της εβδομάδας που έρχεται":"Day of the week it comes in","Μέρα της εβδομάδας που λήγει":"Day of the week it is due","Μέρα της εβδομάδας":"Day of the week","Κάθε 2 εβδομάδες":"Every 2 weeks","δεν διαβάζεται":"can't be read",άδειο:"empty","Ο φάκελος δεν κρατήθηκε":"The folder was not kept","Όσο ζητούσε άδεια για τον φάκελο, το κινητό έκλεισε την εφαρμογή και την ξανάνοιξε, οπότε η άδεια δεν δόθηκε.":"While asking for folder permission, the phone closed the app and reopened it, so the permission was not given.","Όσο ήταν ανοιχτή η επιλογή φακέλου, το κινητό έκλεισε την εφαρμογή και την ξανάνοιξε, οπότε η επιλογή χάθηκε.":"While the folder picker was open, the phone closed the app and reopened it, so the choice was lost.","Συμβαίνει σε μερικά κινητά με τις εγκατεστημένες εφαρμογές. Τα στοιχεία σου δεν πειράχτηκαν.":"This happens on some phones with installed apps. Your data was not touched.","Τελευταίο μήνυμα του κινητού στην επιλογή φακέλου: {e}":"Last message from the phone when choosing a folder: {e}","Δοκίμασε ξανά":"Try again","Διάλεξε τον φάκελο από τον Chrome":"Choose the folder from Chrome","Εκεί πάτα «Διάλεξε φάκελο» και διάλεξε τον φάκελό σου (π.χ. «Λήψεις › backup»).":"There tap “Choose folder” and pick your folder (e.g. “Downloads › backup”).","Γύρνα εδώ. Ο φάκελος είναι ο ίδιος για την εφαρμογή· αν σου ζητήσει άδεια, πάτα «Να επιτρέπεται».":"Come back here. The app uses the same folder; if it asks for permission, tap “Allow”.","Αν δεν τα καταφέρεις, το Google Drive δεν χρειάζεται φάκελο και ανεβάζει μόνο του μετά από κάθε αλλαγή.":"If that doesn't work, Google Drive needs no folder and uploads on its own after every change.","Βρέθηκαν αντίγραφα στο Drive. Η εφαρμογή είναι άδεια, γι' αυτό δεν ανέβηκε τίποτα. Διάλεξε από ποιο θα γίνει επαναφορά.":"Backups were found in Drive. The app is empty, so nothing was uploaded. Choose which one to restore from.","Συνδέθηκε. Θα ανέβει αντίγραφο μόλις υπάρχουν στοιχεία στην εφαρμογή.":"Connected. A backup will be uploaded as soon as there is data in the app.","Δεν ανέβηκε: η εφαρμογή δεν έχει ακόμα στοιχεία.":"Not uploaded: the app has no data yet.","Τελευταίο αντίγραφο έξω από την εφαρμογή: {d}.":"Last backup outside the app: {d}.","Δεν έχει κρατηθεί ακόμα αντίγραφο έξω από την εφαρμογή (Drive, φάκελος, ταχυδρομείο).":"No backup has been kept outside the app yet (Drive, folder, email).","τελευταίο {d}":"latest {d}","μόνο όταν το στείλεις εσύ":"only when you send it","κοινοποίηση, σύννεφο ή αποθήκευση στο κινητό":"share, cloud or save on the phone","δεν υπάρχει ακόμα":"none yet","Πού φυλάγονται τα στοιχεία σου":"Where your data is kept","Πάτα σε μία γραμμή για τις ρυθμίσεις της.":"Tap a row for its settings.","Επαναφορά από αντίγραφο":"Restore from a backup","Κανένα αντίγραφο δεν γράφεται πάνω σε άλλο που έχει περισσότερα στοιχεία: το παλιό φυλάγεται πρώτα. Άδειο αντίγραφο δεν ανεβαίνει ποτέ.":"No backup is ever written over one that has more data: the old one is kept first. An empty backup is never uploaded.","Πάτα «Διάλεξε φάκελο» ή «Αλλαγή φακέλου».":"Tap “Choose folder” or “Change folder”.","Όλα τα αντίγραφά σου μαζί, το νεότερο πρώτο. Δίπλα σε καθένα φαίνεται τι περιέχει. Πάτα ένα για να δεις τι λείπει
