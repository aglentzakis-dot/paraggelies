es”.","Για το ταχυδρομείο συμπλήρωσε μία φορά τα στοιχεία υπηρεσίας αποστολής, πιο κάτω.":"For email, fill in the sending service details once, below.","Δεν έγινε σε: {l}.":"Not done to: {l}.","Δεν έχει ανέβει ακόμα αντίγραφο στο σύννεφο.":"No backup uploaded to the cloud yet.","Δεν έχεις ανεβάσει ακόμα αντίγραφο στο σύννεφο.":"You haven't uploaded a backup to the cloud yet.","Διάλεξε έναν ή περισσότερους τρόπους. Με το κουμπί από κάτω γίνονται όλοι μαζί.":"Choose one or more ways. The button below does them all together.","Επαναφορά από το σύννεφο:":"Restore from the cloud:","Θέλεις να γίνεται εντελώς μόνο του;":"Want it fully automatic?","Κάθε αρχείο έχει την ημερομηνία στο όνομα. Στο σύννεφο μπορείς να σβήνεις τα πολύ παλιά· αρκούν τα 5 πιο πρόσφατα.":"Each file has the date in its name. In the cloud you can delete the very old ones; the 5 most recent are enough.","Κρατήθηκε αντίγραφο μέσα στην εφαρμογή. Διάλεξε και έναν τρόπο έξω από αυτήν.":"A backup was kept inside the app. Also choose a way outside of it.","Κρατιούνται τα {n} πιο πρόσφατα αντίγραφα (ένα τη μέρα) και ένα για καθέναν από τους {m} προηγούμενους μήνες· τα παλιότερα σβήνονται μόνα τους. Αρχεία που έβαλες εσύ δεν πειράζονται.":"The {n} most recent backups are kept (one per day) plus one for each of the previous {m} months; older ones are deleted automatically. Files you added yourself are not touched.","Μέσα στην εφαρμογή κρατιέται αντίγραφο πάντα, μόνο του. Ο φάκελος και το ταχυδρομείο μπορούν να γίνονται και αυτόματα· το σύννεφο θέλει ένα πάτημα από σένα (θα σου το θυμίζει μία φορά την εβδομάδα).":"A backup is always kept inside the app, automatically. The folder and email can also be automatic; the cloud needs one tap from you (you'll be reminded once a week).","Μία φορά την εβδομάδα θα σου θυμίζει να ανεβάσεις αντίγραφο στο σύννεφο.":"Once a week it will remind you to upload a backup to the cloud.","Οδηγίες βήμα βήμα":"Step-by-step instructions","Πάτα «☁️ Ανέβασμα στο σύννεφο τώρα».":"Tap “☁️ Upload to the cloud now”.","Πέρασε μία εβδομάδα από το τελευταίο αντίγραφο στο σύννεφο.":"A week has passed since the last cloud backup.","Πού να κρατάς αντίγραφα":"Where to keep backups","Πρώτη φορά (μία φορά μόνο):":"First time (only once):","Σε υπολογιστή:":"On a computer:","Σύνδεσε τον «Κοινό φάκελο στο κινητό» (πιο κάτω) και βάλε μια εφαρμογή αυτόματου συγχρονισμού φακέλου με το σύννεφο (στο Google Play ψάξε «αυτόματος συγχρονισμός Google Drive»). Ό,τι μπαίνει στον φάκελο ανεβαίνει μόνο του.":"Connect the “Shared folder on the phone” (below) and install an app that syncs a folder with your cloud automatically (in Google Play search “autosync Google Drive”). Everything that goes into the folder is uploaded by itself.","Σύνδεσε τον φάκελο πιο κάτω, στο «Κοινός φάκελος στο κινητό».":"Connect the folder below, in “Shared folder on the phone”.",Σύννεφο:"Cloud","Σύννεφο (Google Drive, OneDrive, Dropbox, iCloud)":"Cloud (Google Drive, OneDrive, Dropbox, iCloud)","Τέλος. Τις επόμενες φορές το σύννεφο θυμάται τον φάκελο· διαλέγεις μόνο «Drive» και «Αποθήκευση».":"Done. Next times the cloud remembers the folder; you just choose “Drive” and “Save”.","Τελευταίο ανέβασμα στο σύννεφο: {d}":"Last cloud upload: {d}","Το αρχείο κατέβηκε στις «Λήψεις». Ανέβασέ το στο σύννεφο σου (π.χ. drive.google.com → «Νέο» → «Μεταφόρτωση αρχείου»).":"The file was saved to “Downloads”. Upload it to your cloud (e.g. drive.google.com → “New” → “File upload”).","Φάκελος στο κινητό":"Folder on the phone","δεν υποστηρίζεται εδώ":"not supported here",σύννεφο:"cloud",ταχυδρομείο:"email","το αρχείο κατεβαίνει στις «Λήψεις». Άνοιξε drive.google.com (ή onedrive.live.com), πάτα «Νέο» → «Μεταφόρτωση αρχείου» και διάλεξέ το.":"the file goes to “Downloads”. Open drive.google.com (or onedrive.live.com), click “New” → “File upload” and choose it.",φάκελος:"folder",προαιρετικό:"optional","(όλη η περίοδος, για Excel)":"(whole period, for Excel)","Α/Α":"No.","Αγορά παγίων":"Fixed asset purchases","Αμοιβές τρίτων" τέλνονται χωριστά.":"Heating expenses (heating oil, natural gas, boiler service) are left out of the common charges. They are issued with «🔥 Issue heating», split by the heating shares, and sent separately.","Έξοδα θέρμανσης του μήνα":"Heating expenses of the month","Προκαταβολή ή έκτακτο ποσό θέρμανσης":"Heating advance or extra amount","π.χ. Προκαταβολή πετρελαίου":"e.g. Heating oil advance",ΘΕΡΜΑΝΣΗ:"HEATING","Ο πίνακας είναι σε ποσοστά (σύνολο 100). Περνάνε σε χιλιοστά: ×10 (π.χ. 3,66% → 36,6‰).":"The table is in percentages (total 100). They are entered as per mille: ×10 (e.g. 3.66% → 36.6‰).","Ο πίνακας είναι σε κλάσματα (σύνολο 1). Περνάνε σε χιλιοστά: ×1000.":"The table is in fractions (total 1). They are entered as per mille: ×1000.","Οι γραμμές μπόιλερ (ζεστό νερό) προστίθενται στο διαμέρισμά τους, π.χ. ΒΑ1 → Α1":"Boiler rows (hot water) are added to their apartment, e.g. ΒΑ1 → Α1","Ανέβασε τον πίνακα χιλιοστών της πολυκατοικίας (PDF, φωτογραφία, Excel). Η εφαρμογή τον διαβάζει, ελέγχει ότι κάθε στήλη βγάζει σύνολο 1000 και σου δείχνει τι θα περαστεί πριν αποθηκευτεί. Όσα διαμερίσματα δεν υπάρχουν, προστίθενται.":"Upload the building's shares table (PDF, photo, Excel). The app reads it, checks that every column adds up to 1000 and shows you what will be entered before saving. Apartments that don't exist yet are added.","Excel ή CSV":"Excel or CSV","Αποθήκευσέ το από το Excel ως «.xlsx» ή «.csv» και ανέβασέ το ξανά.":"Save it from Excel as «.xlsx» or «.csv» and upload it again.","Ταμείο επιχείρησης κοντά στα Ελληνικά Λογιστικά Πρότυπα: κάθε κατηγορία έχει τον κωδικό λογαριασμού που χρησιμοποιούν οι λογιστές, και κάθε κίνηση κρατά παραστατικό, πελάτη ή προμηθευτή, ΑΦΜ, ΦΠΑ και τρόπο πληρωμής. Στο τέλος του μήνα στέλνεις στον λογιστή το «📤 Αρχείο για τον λογιστή».":"Business book close to the Greek Accounting Standards: every category has the account code accountants use, and every entry keeps document, customer or supplier, tax number, VAT and payment method. At the end of the month you send the accountant the “📤 File for the accountant”.","Για διαχειριστές πολυκατοικίας: έσοδα από τα διαμερίσματα και έξοδα όπως ανελκυστήρας, καθαριότητα, απολύμανση, ρεύμα και θέρμανση. Τις κατηγορίες τις αλλάζεις όπως θέλεις από το «Κατηγορίες».":"For building administrators: income from the apartments and expenses such as elevator, cleaning, disinfection, electricity and heating. Change the categories as you like from “Categories”.","Πετρέλαιο που κάηκε ({l})":"Heating oil burned ({l})","Χρέωση θέρμανσης με ό,τι κάηκε, όχι με ό,τι αγοράστηκε":"Charge heating by what was burned, not by what was bought","Από τη δεξαμενή: κάηκαν {l} από {a} έως {b}, αξία {v}.":"From the tank: {l} burned from {a} to {b}, worth {v}.","Για χρέωση με ό,τι κάηκε, γράψε στη δεξαμενή μετρήσεις πόντων στην αρχή και στο τέλος του μήνα.":"To charge by what was burned, record tank readings in cm at the start and end of the month.",λίτρα:"litres","Δεξαμενή πετρελαίου":"Oil tank","χωρητικότητα, πόντοι, γεμίσματα":"capacity, levels, refills","Μέτρηση: {c} πόντοι":"Reading: {c} cm","Γέμισμα: {l} × {p}":"Refill: {l} × {p}","η δεξαμενή ανέβηκε όσο έπρεπε":"the tank rose as expected","η δεξαμενή δείχνει {d} από όσα χρεώθηκαν":"the tank shows {d} versus what was charged","Κάηκαν {l}":"{l} burned",πόντοι:"cm","{l} χωρίς γνωστή τιμή":"{l} without a known price","Η στάθμη ανέβηκε {l} χωρίς γέμισμα. Έλεγξε τη μέτρηση.":"The level rose by {l} without a refill. Check the reading.",αξία:"value","χωρίς γνωστή τιμή":"without a known price","Τελευταία μέτρηση: {c} πόντοι, {d}":"Last reading: {c} cm, {d}","Χωρητικότητα {l}":"Capacity {l}",διάμετρος:"diameter",ύψος:"height","Μέτρηση πόντων":"Level reading",Γέμισμα:"Refill","Έλεγχος με το ταμείο":"Check against the cash book","Πετρέλαιο που αγοράστηκε (γεμίσματα)":"Oil bought (refills)","Πετρέλαιο γραμμένο στα έξοδα του ταμείου":"Oil recorded in the cash book expenses",Διαφορά:"Difference","Κάποιο γέμισμα δεν γράφτηκε στα έξοδα, ή κάπ ο":"Read it","Αντίγραψε το μήνυμα της τράπεζας (SMS ή ειδοποίηση) και επικόλλησέ το εδώ. Η εφαρμογή βρίσκει μόνη της το ποσό, την ημερομηνία και το κατάστημα.":"Copy the bank's message (SMS or notification) and paste it here. The app finds the amount, the date and the shop by itself.","π.χ. Αγορά με κάρτα ****1234 ποσού 23,40 EUR στο SKLAVENITIS στις 07/10.":"e.g. Card ****1234 purchase of 23.40 EUR at SKLAVENITIS on 07/10.",Επικόλληση:"Paste","Πιο γρήγορα: «Κοινοποίηση» από τα μηνύματα":'Faster: "Share" from Messages',"Στα μηνύματα του κινητού κράτα πατημένο το SMS της τράπεζας.":"In your phone's Messages, press and hold the bank's SMS.","Πάτα «Κοινοποίηση» και διάλεξε «Ταμεία».":'Tap "Share" and choose this app.',"Ανοίγει έτοιμη η κίνηση· πατάς «Καταχώρηση».":'The transaction opens ready; you tap "Record".',"Χρειάζεται η εφαρμογή να είναι εγκατεστημένη. Για ειδοποιήσεις της εφαρμογής της τράπεζας, που δεν κοινοποιούνται, άνοιξέ τες, αντίγραψε το κείμενο και επικόλλησέ το εδώ.":"The app must be installed. For notifications of the bank's app, which can't be shared, open them, copy the text and paste it here.","Επικόλλησε πρώτα το μήνυμα.":"Paste the message first.","Το πρόχειρο είναι άδειο.":"The clipboard is empty.","Κράτα πατημένο το κουτί και πάτα «Επικόλληση».":'Press and hold the box and tap "Paste".',"Κινήσεις από το αρχείο της τράπεζας":"Transactions from the bank file",Ανέβασμα:"Upload","Δοκιμή Pro: 30 μέρες με όλα τα ταμεία ανοιχτά, δωρεάν.":"Pro trial: 30 days with all books open, free.","Η δοκιμή Pro τελειώνει σε {n} μέρα.":"The Pro trial ends in {n} day.","Η δοκιμή Pro τελειώνει σε {n} μέρες.":"The Pro trial ends in {n} days.","Μετά, τα Προσωπικά μένουν δωρεάν και όλα σου τα στοιχεία μένουν.":"After that, Personal stays free and all your data stays.","Δες τι περιλαμβάνει":"See what's included",συνδέθηκε:"connected","Ανεβαίνει μόνο του μετά από κάθε αλλαγή, στον φάκελο «GlenApps › Ταμεία» του Drive σου. Εκεί μαζεύονται και οι άλλες εφαρμογές μας, η καθεμί
